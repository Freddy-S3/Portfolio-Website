<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Agentic engineering harness: a central agent node orchestrating skill modules">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191d2b"/>
      <stop offset="1" stop-color="#12181b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#279eae" stop-opacity=".45"/>
      <stop offset="1" stop-color="#279eae" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="225" r="150" fill="url(#glow)"/>

  <!-- orchestration links -->
  <g stroke="#279eae" stroke-opacity=".55" stroke-width="2">
    <path d="M300 225 L150 120" fill="none"/>
    <path d="M300 225 L450 120" fill="none"/>
    <path d="M300 225 L120 260" fill="none"/>
    <path d="M300 225 L480 260" fill="none"/>
    <path d="M300 225 L200 355" fill="none"/>
    <path d="M300 225 L400 355" fill="none"/>
  </g>

  <!-- skill modules -->
  <g fill="#2a2e35" stroke="#279eae" stroke-width="2">
    <rect x="98" y="98" width="104" height="44" rx="8"/>
    <rect x="398" y="98" width="104" height="44" rx="8"/>
    <rect x="68" y="238" width="104" height="44" rx="8"/>
    <rect x="428" y="238" width="104" height="44" rx="8"/>
    <rect x="148" y="333" width="104" height="44" rx="8"/>
    <rect x="348" y="333" width="104" height="44" rx="8"/>
  </g>

  <g fill="#dbe1e8" font-family="'Poppins',system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <text x="150" y="126">plan</text>
    <text x="450" y="126">review</text>
    <text x="120" y="266">debug</text>
    <text x="480" y="266">ship</text>
    <text x="200" y="361">test</text>
    <text x="400" y="361">context</text>
  </g>

  <!-- agent core -->
  <circle cx="300" cy="225" r="54" fill="#191d2b" stroke="#279eae" stroke-width="3"/>
  <text x="300" y="219" text-anchor="middle" font-family="'Poppins',system-ui,sans-serif" font-size="17" font-weight="700" fill="#279eae">AGENT</text>
  <text x="300" y="241" text-anchor="middle" font-family="'Poppins',system-ui,sans-serif" font-size="12" font-weight="500" fill="#b2becd">harness</text>

  <text x="300" y="424" text-anchor="middle" font-family="'Poppins',system-ui,sans-serif" font-size="20" font-weight="700" fill="#f8f8f8" letter-spacing="3">AI HARNESS</text>
</svg>
