      <stop offset="0" stop-color="#191d2b"/>
      <stop offset="1" stop-color="#12181b"/>
    </linearGradient>
    <radialGradient id="pglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#279eae" stop-opacity=".18"/>
