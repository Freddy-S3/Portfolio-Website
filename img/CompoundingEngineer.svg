<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="The Compounding Engineer: a growth curve rising through stacked posts">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191d2b"/>
      <stop offset="1" stop-color="#12181b"/>
    </linearGradient>
    <linearGradient id="curveglow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a23a" stop-opacity=".05"/>
      <stop offset="1" stop-color="#e8a23a" stop-opacity=".5"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg2)"/>

  <!-- grid -->
  <g stroke="#2a2e35" stroke-width="1">
    <line x1="80" y1="80" x2="80" y2="360"/>
    <line x1="80" y1="360" x2="540" y2="360"/>
  </g>

  <!-- compounding curve -->
  <path d="M80 340 C 180 336, 260 300, 320 250 C 380 200, 420 120, 540 90"
        fill="none" stroke="url(#curveglow)" stroke-width="4" stroke-linecap="round"/>

  <!-- post nodes along the curve -->
  <g fill="#2a2e35" stroke="#e8a23a" stroke-width="2">
    <rect x="112" y="316" width="88" height="36" rx="7"/>
    <rect x="228" y="272" width="88" height="36" rx="7"/>
    <rect x="356" y="188" width="88" height="36" rx="7"/>
    <rect x="470" y="88" width="88" height="30" rx="7"/>
  </g>

  <g fill="#dbe1e8" font-family="'Poppins',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <text x="156" y="339">skill #1</text>
    <text x="272" y="295">skill #2</text>
    <text x="400" y="211">habit</text>
    <text x="514" y="107">leverage</text>
  </g>

  <text x="300" y="424" text-anchor="middle" font-family="'Poppins',system-ui,sans-serif" font-size="19" font-weight="700" fill="#f8f8f8" letter-spacing="2">THE COMPOUNDING ENGINEER</text>
</svg>
