name: Build resume and cascade into site

on:
  push:
    paths:
      - 'resume/**'
      - 'tools/resume_to_site.py'
      - 'tools/check_resume.py'
      - 'tools/check_resume_drift.py'
      - 'tools/asset-map.json'
      - 'Certificates/Freddy_Shaikh_Resume.pdf'
      - 'requirements.txt'
      - '.github/workflows/resume.yml'
  pull_request:
    paths:
      - 'resume/**'
      - 'tools/resume_to_site.py'
      - 'tools/check_resume.py'
      - 'tools/check_resume_drift.py'
      - 'tools/asset-map.json'
      - 'Certificates/Freddy_Shaikh_Resume.pdf'
      - 'requirements.txt'
      - '.github/workflows/resume.yml'
  workflow_dispatch:

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The source path controls automatic publication. PDF-only changes remain in the
      # trigger set so direct edits are validated; a bot PDF commit gets one no-op
      # validation run because source_changes is false.
      - name: Detect resume source changes
        id: source_changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" "${{ github.sha }}" -- resume/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Without a pinned clock the PDF gets a fresh timestamp and /ID each run, so the
      # committed file churns and conflicts with any open branch.
      - name: Pin the build clock to the last resume commit
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- resume/)" >> "$GITHUB_ENV"
          echo "FORCE_SOURCE_DATE=1" >> "$GITHUB_ENV"

      # Use the same pinned self-contained engine as tools/build-resume.ps1. The
      # runner's TeX Live layout differs from the local artifact and fails the resume's
      # row-alignment guard, so publishing a different CI rendering is unsafe.
      - name: Install Tectonic 0.17.0
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$RUNNER_TEMP/tectonic.tar.gz"
          echo '1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606  '"$RUNNER_TEMP/tectonic.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/tectonic"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tectonic" --version

      - name: Compile resume.tex with Tectonic
        working-directory: resume
        run: tectonic -X compile resume.tex --outdir . --keep-logs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Installed before any check runs, not after: check_resume.py needs pymupdf, and
      # an ad-hoc install later in the job would leave the gates below unrunnable.
      - name: Install Python tooling
        run: python -m pip install -r requirements.txt

      # Gate 1: the fresh CI build is sound before it can replace the published copy -
      # one page, no blank bands, no misaligned table rows, ASCII hyphens in the text
      # layer.
      - name: Check the freshly built PDF
        run: |
          python tools/check_resume.py resume/resume.pdf \
            --sources resume/resume \
            --allow-orphan-page \
            --max-pages 1

      # Source changes are the only event that should rewrite the tracked PDF. This
      # closes the stale-artifact gap after a source PR merges; the resulting bot commit
      # cannot publish recursively because source_changes is false on that run.
      - name: Refresh the published PDF after source changes
        if: github.event_name == 'push' && steps.source_changes.outputs.changed == 'true'
        run: cp resume/resume.pdf Certificates/Freddy_Shaikh_Resume.pdf

      - name: Check the published PDF
        run: |
          python tools/check_resume.py Certificates/Freddy_Shaikh_Resume.pdf \
            --sources resume/resume \
            --allow-orphan-page \
            --max-pages 1

      # Gate 2: that published copy still carries the current sources. On a push after
      # resume/ changes, the refresh step above updates it first. On a pull request,
      # this remains a blocking check so a reviewer can see a stale artifact before
      # merge even if branch protection is not enabled.
      #
      # Certificates/Freddy_Shaikh_Resume.pdf stays tracked because the site deploy
      # syncs the git tree to S3 and never compiles LaTeX - untracking it would 404
      # https://www.freddyshaikh.com/Certificates/Freddy_Shaikh_Resume.pdf, which is
      # linked from the live portfolio and from job applications. So drift is detected
      # rather than eliminated: this step fails the build when the committed PDF has
      # fallen behind resume/, instead of the gap being noticed weeks later.
      #
      # Compared on text layer and page count only. Those are toolchain-independent and
      # are what staleness actually looks like. Geometry is left to --check-geometry in
      # the local build script, where both sides come from the same TeX install.
      - name: Fail if the published PDF has drifted from source
        run: |
          python tools/check_resume_drift.py \
            resume/resume.pdf \
            Certificates/Freddy_Shaikh_Resume.pdf

      # Kept for download off the run summary, so a reviewer can read the build that
      # the gates above just judged without compiling anything locally.
      - name: Upload the built PDF as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume/resume.pdf
          if-no-files-found: error

      - name: Cascade resume into index.html
        run: python tools/resume_to_site.py

      - name: Regenerate job-board exports
        run: python tools/resume_export.py

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      # The browser suite runs AFTER the cascade above, so it checks the index.html this
      # run just generated rather than the one committed last time. test_site.py loads the
      # page over file:// and needs no server.
      - name: Render index.html in Chromium and check it
        run: python tools/test_site.py

      - name: Commit refreshed site
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The PDF is refreshed only when resume/ changed. Byte-level churn is
          # acceptable here because the commit is tied to a real source change. A
          # PDF-only bot commit gets a validation-only follow-up run.
          git add Certificates/Freddy_Shaikh_Resume.pdf index.html resume.data.json exports/
          if git diff --cached --quiet; then
            echo "No resume changes to publish."
          else
            git commit -m "Rebuild resume PDF and cascade into site"
            # A push landing while this job runs leaves the branch ahead; rebase and retry.
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (attempt $attempt), rebasing onto origin."
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
            echo "Could not push after 3 attempts."
            exit 1
          fi
