name: Build resume and cascade into site

on:
  push:
    paths:
      - 'resume/**'
      - 'tools/resume_to_site.py'
      - 'tools/asset-map.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without a pinned clock the PDF gets a fresh timestamp and /ID each run, so the
      # committed file churns and conflicts with any open branch.
      - name: Pin the build clock to the last resume commit
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- resume/)" >> "$GITHUB_ENV"
          echo "FORCE_SOURCE_DATE=1" >> "$GITHUB_ENV"

      - name: Compile resume.tex with xelatex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume
          latexmk_use_xelatex: true

      - name: Publish PDF to Certificates/
        run: cp resume/resume.pdf "Certificates/Freddy_Shaikh_Resume.pdf"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cascade resume into index.html
        run: python tools/resume_to_site.py

      - name: Regenerate job-board exports
        run: python tools/resume_export.py

      # The browser suite runs AFTER the cascade above, so it checks the index.html this
      # run just generated rather than the one committed last time. test_site.py loads the
      # page over file:// and needs no server.
      - name: Install Python tooling
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Render index.html in Chromium and check it
        run: python tools/test_site.py

      - name: Commit refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The PDF is still built and published to Certificates/ above (so this run's
          # artifacts and any local copy stay usable), but it is deliberately left out of
          # this commit: even with the clock pinned above, xelatex still produces a
          # byte-different PDF on every run, so committing it churns git history for no
          # reason. Run tools/build-resume.ps1 locally when you want the checked-in PDF
          # to catch up.
          git add index.html resume.data.json exports/
          if git diff --cached --quiet; then
            echo "No resume changes to publish."
          else
            git commit -m "Rebuild resume PDF and cascade into site"
            # A push landing while this job runs leaves the branch ahead; rebase and retry.
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (attempt $attempt), rebasing onto origin."
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
            echo "Could not push after 3 attempts."
            exit 1
          fi
